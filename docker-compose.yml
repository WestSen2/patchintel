services:
  db:
    image: postgres:16-alpine
    container_name: patchintel-db
    environment:
      POSTGRES_USER: patchintel
      POSTGRES_PASSWORD: patchintel
      POSTGRES_DB: patchintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchintel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
